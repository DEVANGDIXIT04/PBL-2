name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pfm/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check app tests
      - name: Black
        run: python -m black --check app tests alembic
      - name: Mypy
        run: python -m mypy app
      - name: Pytest
        run: python -m pytest

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t pfm-api pfm/backend
      - name: Build frontend image
        run: docker build -t pfm-web pfm/frontend
